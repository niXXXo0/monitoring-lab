- name: Create Alertmanager user
  ansible.builtin.user:
    name: "{{ alertmanager_user }}"
    group: "{{ alertmanager_group }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false


- name: Create Alertmanager config directory
  ansible.builtin.file:
    path: "{{ alertmanager_config_dir }}"
    state: directory
    owner: "{{ alertmanager_user }}"
    group: "{{ alertmanager_group }}"
    mode: "0755"


- name: Create Alertmanager data directory
  ansible.builtin.file:
    path: "{{ alertmanager_data_dir }}"
    state: directory
    owner: "{{ alertmanager_user }}"
    group: "{{ alertmanager_group }}"
    mode: "0755"


- name: Download Alertmanager
  ansible.builtin.get_url:
    url: "{{ alertmanager_download_url }}"
    dest: "/tmp/alertmanager-{{ alertmanager_version }}.tar.gz"
    mode: "0644"


- name: Extract Alertmanager archive
  ansible.builtin.unarchive:
    src: "/tmp/alertmanager-{{ alertmanager_version }}.tar.gz"
    dest: "/tmp"
    remote_src: true


- name: Install Alertmanager binary
  ansible.builtin.copy:
    src: "/tmp/alertmanager-{{ alertmanager_version }}.{{ alertmanager_arch }}/alertmanager"
    dest: "/usr/local/bin/alertmanager"
    owner: root
    group: root
    mode: "0755"
    remote_src: true


- name: Install amtool binary
  ansible.builtin.copy:
    src: "/tmp/alertmanager-{{ alertmanager_version }}.{{ alertmanager_arch }}/amtool"
    dest: "/usr/local/bin/amtool"
    owner: root
    group: root
    mode: "0755"
    remote_src: true


- name: Debug Telegram variables
  ansible.builtin.debug:
    msg:
      - "token_defined: {{ alertmanager_telegram_bot_token is defined }}"
      - "chat_id_defined: {{ alertmanager_telegram_chat_id is defined }}"


- name: Configure Alertmanager
  ansible.builtin.template:
    src: alertmanager.yml.j2
    dest: "{{ alertmanager_config_file }}"
    owner: "{{ alertmanager_user }}"
    group: "{{ alertmanager_group}}"
    mode: "0644"
  notify: Restart Alertmanager


- name: Install Alertmanager systemd service
  ansible.builtin.template:
    src: alertmanager.service.j2
    dest: /etc/systemd/system/alertmanager.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart Alertmanager


- name: Enable and start Alertmanager
  ansible.builtin.systemd:
    name: alertmanager
    state: started
    enabled: true
    daemon_reload: true
