name: CD test


on:
  push:
    branches:
      - ci


jobs:
  ansible-check:
    runs-on: self-hosted


    steps:
      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Create vault password file
        env:
          VAULT_PASSWORD: ${{ secrets.VAULT_PASSWORD }}
        run: |
          printf '%s\n' "$VAULT_PASSWORD" > "$RUNNER_TEMP/vault_password"
          chmod 600 "$RUNNER_TEMP/vault_password"


      - name: Deploy with Ansible
        working-directory: ansible
        run: ansible-playbook -i inventory/hosts.yml playbooks/site.yml --vault-password-file "$RUNNER_TEMP/vault_password"
