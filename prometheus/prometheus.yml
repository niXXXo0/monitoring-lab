global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
      - targets:
            - "localhost:9093"

rule_files:
   - "/etc/prometheus/rules.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "debian-servers"
    static_configs:
      - targets:
          - "192.168.100.11:9100"
          - "192.168.100.12:9100"
